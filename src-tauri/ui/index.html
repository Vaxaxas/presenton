<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presenton</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #090d16 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 420px;
      padding: 32px;
      background: rgba(30, 41, 59, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.15);
    }
    .logo-box {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      margin-bottom: 24px;
    }
    .logo-box svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }
    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 999px;
      animation: indeterminate 1.6s cubic-bezier(0.65, 0.05, 0.36, 1) infinite;
    }
    @keyframes indeterminate {
      0% {
        left: -40%;
        width: 40%;
      }
      50% {
        left: 20%;
        width: 70%;
      }
      100% {
        left: 100%;
        width: 40%;
      }
    }
    .status-text {
      font-size: 13px;
      color: #818cf8;
      font-weight: 500;
    }
    .error-msg {
      font-size: 12px;
      color: #f87171;
      margin-top: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-box">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="3" width="20" height="14" rx="2" />
        <line x1="8" y1="21" x2="16" y2="21" />
        <line x1="12" y1="17" x2="12" y2="21" />
      </svg>
    </div>
    <h1>Presenton</h1>
    <p class="subtitle">Open-Source AI Presentation Generator</p>
    <div class="progress-bar">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="status-text" id="status">Starting presentation services...</div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("errorMsg");
    let attempts = 0;
    const maxAttempts = 120;

    function navigateToStudio() {
      statusEl.textContent = "Connecting to presentation studio...";
      setTimeout(() => {
        window.location.replace("http://127.0.0.1:3000");
      }, 300);
    }

    async function checkServer() {
      attempts++;
      try {
        // 1. Try health endpoint
        const healthRes = await fetch("http://127.0.0.1:3000/api/health", {
          method: "GET",
          headers: { "Cache-Control": "no-cache" }
        }).catch(() => null);

        if (healthRes && healthRes.status < 500) {
          navigateToStudio();
          return;
        }

        // 2. Try runtime-config endpoint
        const configRes = await fetch("http://127.0.0.1:3000/api/runtime-config", {
          method: "GET",
          headers: { "Cache-Control": "no-cache" }
        }).catch(() => null);

        if (configRes && configRes.status < 500) {
          navigateToStudio();
          return;
        }

        // 3. Fallback: try root
        await fetch("http://127.0.0.1:3000/", {
          method: "GET",
          mode: "no-cors",
          headers: { "Cache-Control": "no-cache" }
        });
        // If fetch did not throw network error (ERR_CONNECTION_REFUSED), port 3000 is listening!
        navigateToStudio();
        return;
      } catch (err) {
        // server not ready yet
      }

      if (attempts > 5) {
        statusEl.textContent = `Preparing local AI backend (attempt ${attempts}/${maxAttempts})...`;
      }
      if (attempts >= maxAttempts) {
        statusEl.textContent = "Taking longer than usual to start.";
        errorEl.style.display = "block";
        errorEl.textContent = "Please make sure ports 3000 and 5001 are free and not blocked by antivirus.";
        return;
      }
      setTimeout(checkServer, 800);
    }

    setTimeout(checkServer, 1000);
  </script>
</body>
</html>
