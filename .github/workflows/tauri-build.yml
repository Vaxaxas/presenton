name: Tauri Multi-Platform Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tauri on ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows (x64)
            os: windows-latest
            artifact_name: Presenton-Windows-x64-Setup
          - name: macOS Apple Silicon (arm64)
            os: macos-latest
            artifact_name: Presenton-macOS-arm64
          - name: macOS Intel (x64)
            os: macos-13
            artifact_name: Presenton-macOS-x64
          - name: Linux Ubuntu (x64)
            os: ubuntu-22.04
            artifact_name: Presenton-Linux-x64

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up astral-sh uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: servers/fastapi/uv.lock

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install presentation-export runtime
        run: |
          node scripts/sync-presentation-export.cjs

      - name: Build Next.js standalone bundle
        shell: bash
        run: |
          cd servers/nextjs
          npm install
          export PRESENTON_ELECTRON_BUILD="true"
          npm run build
          cd ../..

      - name: Ensure spaCy model & Build FastAPI with PyInstaller
        shell: bash
        run: |
          node electron/scripts/ensure-spacy-model.cjs || true
          cd servers/fastapi
          uv sync
          uv run --with pyinstaller python -m PyInstaller --distpath ../../src-tauri/resources server.spec
          cd ../..

      - name: Prepare Tauri bundled resources
        shell: bash
        run: |
          node scripts/prepare-tauri-resources.cjs

      - name: Build Tauri Desktop Application
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@^2 build

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/presenton.exe
            src-tauri/target/release/presenton
          if-no-files-found: warn
