name: Tauri Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build Tauri Windows Installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up astral-sh uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: servers/fastapi/uv.lock

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Install presentation-export runtime
        run: |
          node scripts/sync-presentation-export.cjs

      - name: Build Next.js standalone bundle
        shell: pwsh
        run: |
          cd servers/nextjs
          npm install
          $env:PRESENTON_ELECTRON_BUILD="true"
          npm run build
          cd ../..

      - name: Build FastAPI executable with PyInstaller
        shell: pwsh
        run: |
          cd servers/fastapi
          uv sync
          uv run --with pyinstaller python -m PyInstaller --distpath ../../src-tauri/resources server.spec
          cd ../..

      - name: Prepare Tauri bundled resources
        shell: pwsh
        run: |
          node scripts/prepare-tauri-resources.cjs

      - name: Build Tauri Desktop .exe
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@^2 build

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Presenton-Windows-x64-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/presenton.exe
          if-no-files-found: error
